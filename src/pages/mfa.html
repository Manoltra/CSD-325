<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta charset="utf-8">
	<title> ProPhoto </title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Island+Moments&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../css/styles.css">
	<script src="../js/script.js"></script>
</head>

<body onload ="mfa_initHandler()">
  <header>
        <div  href="index.html" class="logo">ProPhoto</div>
        <div class="header-buttons">
          <a href="login.html" class="btn login-btn">Login</a>
          <a href="register.html" class="btn register-btn">Register</a>
        </div>
  </header>
    <h2 class="welcome-text">Authenticate</h2>
    <form class="login-card animate" id="loginCard" onsubmit="event.preventDefault(); verifyMFAHandler();">
      <label for="mfa-code">Code</label>
      <input type="text" id="mfa-code" name="mfa-code" placeholder="Enter your code" required>

      <button type="submit" class="btn submit-btn" >Submit</button>
    </form>
    <footer class="site-footer">
    © 2026 ProPhoto. All rights reserved.
  </footer>

</body>
</html>
