<!DOCTYPE html>
<html lang="en-US">

<head>
	<meta charset="utf-8">
	<title> ProPhoto </title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Island+Moments&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
	<script src="../js/script.js"></script>
</head>


<body>
  <header>
        <div  href="index.html" class="logo">ProPhoto</div>
        <div class="header-buttons">
          <a href="signin.html" class="btn sign-in-btn">Sign in</a>
          <button class="btn register-btn">Register</button>
        </div>
    </header>
  </header>
    <h2 class="welcome-text">Register</h2>
    <form class="login-card animate" id="loginCard" onsubmit="event.preventDefault(); registerButtonHandler();">

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" class="btn submit-btn">Register</button>
    </form>
    <footer class="site-footer">
    © 2026 ProPhoto. All rights reserved.
  </footer>

  <script>
async function registerButtonHandler(event) {
    event.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    try {
        const response = await fetch('/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({email, password })
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('Registration successful! Please log in.');
            window.location.href = '/login';
        } else {
            alert('Registration failed: ' + result.message);
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Server error. Please try again.');
    }
}
</script>
</body>
</html>
